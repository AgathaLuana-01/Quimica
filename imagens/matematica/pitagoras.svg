<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 245" role="img" aria-label="Triângulo retângulo de catetos 3 m e 4 m e hipotenusa 5 m."><style>text{font-family:Arial,sans-serif;fill:#173d43;font-size:17px} .small{font-size:14px} .b{font-weight:bold} .line{stroke:#1d6d5e;stroke-width:3;fill:none}</style><rect width="100%" height="100%" rx="15" fill="#f5fbf9"/><path d="M150 185 V25 L270 185 Z" stroke="#1d6d5e" stroke-width="4" fill="#dceeea"/><path d="M150 168 h17 v17" class="line"/><text x="132" y="105" text-anchor="end">4 m</text><text x="210" y="210" text-anchor="middle">3 m</text><text x="225" y="95">c = 5 m</text><text x="400" y="65" class="b">c² = a² + b²</text><text x="400" y="100">c² = 3² + 4²</text><text x="400" y="135">c² = 25</text><text x="400" y="170">c = 5 m</text></svg>