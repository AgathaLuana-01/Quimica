<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 245" role="img" aria-label="Um quarto de círculo representa 25% e tem ângulo central de 90°."><style>text{font-family:Arial,sans-serif;fill:#173d43;font-size:17px} .small{font-size:14px} .b{font-weight:bold} .line{stroke:#1d6d5e;stroke-width:3;fill:none}</style><rect width="100%" height="100%" rx="15" fill="#f5fbf9"/><circle cx="170" cy="120" r="90" fill="#dceeea" stroke="#1d6d5e"/><path d="M170 120 V30 A90 90 0 0 1 260 120 Z" fill="#1d6d5e"/><text x="310" y="85" class="b">25% = 1/4</text><text x="310" y="120">360° × 0,25 = 90°</text><text x="310" y="155">Setor verde: 10 de 40 alunos</text></svg>