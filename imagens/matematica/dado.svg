<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 205" role="img" aria-label="Resultados de um dado equilibrado; os pares estão destacados."><style>text{font-family:Arial,sans-serif;fill:#173d43;font-size:17px} .small{font-size:14px} .b{font-weight:bold} .line{stroke:#1d6d5e;stroke-width:3;fill:none}</style><rect width="100%" height="100%" rx="15" fill="#f5fbf9"/><rect x="35" y="58" width="80" height="80" rx="12" fill="#edf1f3" stroke="#1d6d5e"/><text x="75" y="108" text-anchor="middle" style="font-size:32px">1</text><rect x="137" y="58" width="80" height="80" rx="12" fill="#cce9de" stroke="#1d6d5e"/><text x="177" y="108" text-anchor="middle" style="font-size:32px">2</text><rect x="239" y="58" width="80" height="80" rx="12" fill="#edf1f3" stroke="#1d6d5e"/><text x="279" y="108" text-anchor="middle" style="font-size:32px">3</text><rect x="341" y="58" width="80" height="80" rx="12" fill="#cce9de" stroke="#1d6d5e"/><text x="381" y="108" text-anchor="middle" style="font-size:32px">4</text><rect x="443" y="58" width="80" height="80" rx="12" fill="#edf1f3" stroke="#1d6d5e"/><text x="483" y="108" text-anchor="middle" style="font-size:32px">5</text><rect x="545" y="58" width="80" height="80" rx="12" fill="#cce9de" stroke="#1d6d5e"/><text x="585" y="108" text-anchor="middle" style="font-size:32px">6</text><text x="340" y="30" text-anchor="middle">Seis resultados possíveis</text><text x="340" y="180" text-anchor="middle">Três pares: 2, 4 e 6 → 3/6 = 50%</text></svg>