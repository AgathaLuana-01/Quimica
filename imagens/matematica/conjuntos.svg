<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 245" role="img" aria-label="Os naturais estão dentro dos inteiros, que estão dentro dos racionais; irracionais ficam fora de ℚ."><style>text{font-family:Arial,sans-serif;fill:#173d43;font-size:17px} .small{font-size:14px} .b{font-weight:bold} .line{stroke:#1d6d5e;stroke-width:3;fill:none}</style><rect width="100%" height="100%" rx="15" fill="#f5fbf9"/><rect x="15" y="15" width="650" height="215" rx="15" fill="#e0e8f0" stroke="#64748b"/><text x="28" y="40" class="b">ℝ reais</text><rect x="30" y="55" width="425" height="163" rx="12" fill="#dbeafe" stroke="#3972a6"/><text x="45" y="79" class="b">ℚ racionais: 1/2, 0,75</text><rect x="50" y="92" width="390" height="114" rx="10" fill="#d8efe7" stroke="#1d6d5e"/><text x="65" y="117" class="b">ℤ inteiros: −3, −2, −1</text><rect x="70" y="130" width="350" height="63" rx="8" fill="#fff0c6" stroke="#b58920"/><text x="85" y="155" class="b">ℕ naturais</text><text x="85" y="179">0, 1, 2, 3, ...</text><text x="470" y="82" class="b">Irracionais</text><text x="470" y="115">π, √2, √3</text></svg>